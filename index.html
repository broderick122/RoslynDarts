<meta name="theme-color" content="#1c4a38">
<script>
(function () {
  var theme = "light";
  try {
    var saved = localStorage.getItem("roslynDarts.theme");
    if (saved === "light" || saved === "dark") theme = saved;
    else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#10241c" : "#1c4a38");
})();
</script>
